<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="deboss-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#A67B5B" />
      <stop offset="60%" stop-color="#8C5C3D" />
      <stop offset="100%" stop-color="#6E442B" />
    </radialGradient>
    <filter id="deboss-depth">
      <feOffset dx="1" dy="2" />
      <feGaussianBlur stdDeviation="1" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.6" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="12" fill="url(#deboss-bg)" />
  <circle cx="100" cy="100" r="45" fill="none" stroke="#52321D" stroke-width="6" filter="url(#deboss-depth)" />
  <path d="M75 100 L125 100 M100 75 L100 125" stroke="#52321D" stroke-width="6" stroke-linecap="round" filter="url(#deboss-depth)" />
</svg>
