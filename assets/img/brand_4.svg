<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E4A47" />
      <stop offset="100%" stop-color="#051C1A" />
    </radialGradient>
    <!-- Journal Gradient (Teal/Green Leather) -->
    <linearGradient id="journal-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6F6B" />
      <stop offset="5%" stop-color="#148F8A" />
      <stop offset="10%" stop-color="#0F6F6B" />
      <stop offset="90%" stop-color="#127F7A" />
      <stop offset="100%" stop-color="#073B39" />
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E5A" />
      <stop offset="50%" stop-color="#FDF0CD" />
      <stop offset="100%" stop-color="#8A6623" />
    </linearGradient>
    <!-- Carnival Cruise Funnel Colors -->
    <linearGradient id="funnel-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D11A2A" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <linearGradient id="funnel-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="100%" stop-color="#004B87" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-5" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="8" fill="url(#bg)" />

  <!-- Journal Spine Shadows and Pages -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Pages -->
    <rect x="175" y="10" width="8" height="300" rx="2" fill="#EADBC8" />
    <!-- Journal Cover -->
    <rect x="0" y="0" width="180" height="320" rx="6" fill="url(#journal-leather)" />
    
    <!-- Spine Accent line -->
    <line x1="15" y1="0" x2="15" y2="320" stroke="#073B39" stroke-width="2" />
    
    <!-- Bookmark Ribbon -->
    <path d="M 90 320 Q 95 335 110 345 L 120 345 Q 100 330 95 320 Z" fill="url(#gold)" />

    <!-- Carnival Funnel Logo in Foil -->
    <g transform="translate(45, 110)">
      <!-- Funnel Shape (Artistic Funnel/Wing shape) -->
      <!-- Left side (Blue) -->
      <path d="M 15 30 L 35 30 L 45 60 L 15 60 Z" fill="url(#funnel-blue)" />
      <!-- Right wing (Red) -->
      <path d="M 75 30 L 55 30 L 45 60 L 75 60 Z" fill="url(#funnel-red)" />
      <!-- Center swoop (Gold/White highlight) -->
      <path d="M 30 30 Q 45 40 60 30 L 45 60 Z" fill="url(#gold)" />
      
      <!-- Text -->
      <text x="45" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="url(#gold)" letter-spacing="1" text-anchor="middle">Carnival</text>
      <!-- Subtext -->
      <text x="45" y="98" font-family="'Inter', sans-serif" font-weight="500" font-size="7" fill="url(#gold)" letter-spacing="1.5" text-anchor="middle">OFFICER'S CLUB</text>
    </g>
  </g>
</svg>
