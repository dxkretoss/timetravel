<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="100%" stop-color="#1A0305" />
    </radialGradient>
    <!-- Journal Gradient (Red Leather) -->
    <linearGradient id="journal-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BA0C2F" />
      <stop offset="5%" stop-color="#E41E3F" />
      <stop offset="10%" stop-color="#BA0C2F" />
      <stop offset="90%" stop-color="#D91A3C" />
      <stop offset="100%" stop-color="#80051B" />
    </linearGradient>
    <!-- White Silver Foil Gradient for logo -->
    <linearGradient id="silver-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E6E6" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCCCCC" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-5" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="8" fill="url(#bg)" />

  <!-- Journal Spine Shadows and Pages -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Pages -->
    <rect x="175" y="10" width="8" height="300" rx="2" fill="#EADBC8" />
    <!-- Journal Cover -->
    <rect x="0" y="0" width="180" height="320" rx="6" fill="url(#journal-leather)" />
    
    <!-- Spine Accent line -->
    <line x1="15" y1="0" x2="15" y2="320" stroke="#80051B" stroke-width="2" />
    
    <!-- Bookmark Ribbon -->
    <path d="M 90 320 Q 95 335 110 345 L 120 345 Q 100 330 95 320 Z" fill="url(#silver-foil)" />

    <!-- Coca-Cola Styled Script Logo (Represented artistically/simply) -->
    <g transform="translate(20, 110)">
      <!-- Art/dynamic ribbon swoosh -->
      <path d="M 10 90 Q 50 70 90 85 T 130 75" fill="none" stroke="url(#silver-foil)" stroke-width="4" opacity="0.8" />
      <path d="M 5 98 Q 45 78 85 93 T 135 80" fill="none" stroke="url(#silver-foil)" stroke-width="1.5" opacity="0.6" />
      
      <!-- Script representation -->
      <text x="70" y="50" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="700" font-size="28" fill="url(#silver-foil)" text-anchor="middle">Coca-Cola</text>
      <!-- Subtext -->
      <text x="70" y="115" font-family="'Inter', sans-serif" font-weight="600" font-size="7" fill="url(#silver-foil)" letter-spacing="3" text-anchor="middle">PARTNERS PROGRAM</text>
    </g>
  </g>
</svg>
