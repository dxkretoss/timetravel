<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E2A38" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FDF0CD" />
      <stop offset="100%" stop-color="#8A6623" />
    </linearGradient>
    <!-- Journal Gradient -->
    <linearGradient id="journal-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="5%" stop-color="#172A45" />
      <stop offset="10%" stop-color="#0A192F" />
      <stop offset="90%" stop-color="#112240" />
      <stop offset="100%" stop-color="#020C1B" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-5" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="8" fill="url(#bg)" />

  <!-- Journal Spine Shadows and Pages -->
  <!-- We show the journal slightly angled or standing -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Pages (Gold/Cream Edge) -->
    <rect x="175" y="10" width="8" height="300" rx="2" fill="#EADBC8" />
    <!-- Journal Cover -->
    <rect x="0" y="0" width="180" height="320" rx="6" fill="url(#journal-leather)" />
    
    <!-- Spine Accent line -->
    <line x1="15" y1="0" x2="15" y2="320" stroke="#020C1B" stroke-width="2" />
    
    <!-- Bookmark Ribbon -->
    <path d="M 90 320 Q 95 335 110 345 L 120 345 Q 100 330 95 320 Z" fill="url(#gold)" />

    <!-- Morgan Stanley Logo & text in Gold Foil -->
    <g transform="translate(45, 120)" fill="url(#gold)">
      <!-- Triangle logo mark -->
      <polygon points="45,0 90,78 0,78" fill="url(#gold)" opacity="0.9" />
      <polygon points="45,15 77,70 13,70" fill="#0A192F" />
      <polygon points="45,30 64,62 26,62" fill="url(#gold)" opacity="0.9" />
      <!-- Text -->
      <text x="45" y="105" font-family="'Inter', sans-serif" font-weight="700" font-size="10" letter-spacing="1.5" text-anchor="middle">MORGAN STANLEY</text>
      <text x="45" y="120" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" font-size="9" letter-spacing="1" text-anchor="middle">Private Wealth Management</text>
    </g>
  </g>
</svg>
