<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#0A1D37" />
    </radialGradient>
    <!-- Journal Gradient -->
    <linearGradient id="journal-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004B87" />
      <stop offset="5%" stop-color="#0066B2" />
      <stop offset="10%" stop-color="#004B87" />
      <stop offset="90%" stop-color="#00529C" />
      <stop offset="100%" stop-color="#002D54" />
    </linearGradient>
    <!-- Silver Foil Gradient for logo/accents -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCCCCC" />
      <stop offset="50%" stop-color="#F2F2F2" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <!-- Citibank Red Arc Gradient -->
    <linearGradient id="citi-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#D11A2A" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-5" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="8" fill="url(#bg)" />

  <!-- Journal Spine Shadows and Pages -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Pages -->
    <rect x="175" y="10" width="8" height="300" rx="2" fill="#EADBC8" />
    <!-- Journal Cover -->
    <rect x="0" y="0" width="180" height="320" rx="6" fill="url(#journal-leather)" />
    
    <!-- Spine Accent line -->
    <line x1="15" y1="0" x2="15" y2="320" stroke="#002D54" stroke-width="2" />
    
    <!-- Bookmark Ribbon -->
    <path d="M 90 320 Q 95 335 110 345 L 120 345 Q 100 330 95 320 Z" fill="url(#silver)" />

    <!-- Citibank Logo (Debossed/Foil) -->
    <g transform="translate(30, 130)">
      <!-- Red Arc -->
      <path d="M 23 30 Q 60 0 97 30" fill="none" stroke="url(#citi-red)" stroke-width="8" stroke-linecap="round" />
      <!-- Citi Text in Silver -->
      <text x="60" y="55" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="url(#silver)" letter-spacing="-1" text-anchor="middle">citi</text>
      <!-- Subtext -->
      <text x="60" y="80" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="url(#silver)" letter-spacing="2" text-anchor="middle">ANNUAL FORUM</text>
    </g>
  </g>
</svg>
